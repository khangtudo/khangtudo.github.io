<!-- Concept 1: Dimensional Portal (Khối không gian đa chiều + Chấm định danh) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="c1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="c1-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Icon: 3D AR Spatial Card & Identity Node -->
  <g transform="translate(10, 10)">
    <!-- Back Card (Spatial AR Offset) -->
    <rect x="22" y="8" width="46" height="64" rx="8" fill="none" stroke="url(#c1-grad)" stroke-width="2.5" opacity="0.4" transform="rotate(12 45 40)"/>
    <!-- Front Card -->
    <rect x="16" y="8" width="46" height="64" rx="8" fill="url(#c1-card)" stroke="url(#c1-grad)" stroke-width="2.5"/>
    <!-- QR / Chip Matrix Element -->
    <rect x="24" y="18" width="12" height="12" rx="2" fill="#38bdf8"/>
    <circle cx="50" cy="24" r="3" fill="#60a5fa"/>
    <line x1="24" y1="42" x2="52" y2="42" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="50" x2="44" y2="50" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="58" r="4" fill="#38bdf8"/>
  </g>
  <!-- Brand Text -->
  <text x="100" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" fill="#ffffff" letter-spacing="-1">inid<tspan fill="#38bdf8">.me</tspan></text>
  <text x="102" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11" fill="#94a3b8" letter-spacing="1.5">SMART AR VCARD • OFFLINE QR</text>
</svg>
