<!-- Concept 2: Minimalist Infinity Loop & Chip (Vòng lặp vô tận & Chip tiếp xúc không chạm) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="c2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <g transform="translate(15, 15)">
    <!-- Hexagonal AR Marker Frame -->
    <polygon points="35,5 65,22 65,58 35,75 5,58 5,22" fill="none" stroke="url(#c2-grad)" stroke-width="3" stroke-linejoin="round"/>
    <!-- QR Finder Pattern Inside -->
    <rect x="23" y="28" width="24" height="24" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="29" y="34" width="12" height="12" rx="2" fill="url(#c2-grad)"/>
    <!-- Wave Signals -->
    <path d="M 68 30 C 74 35, 74 45, 68 50" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 74 24 C 83 33, 83 47, 74 56" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
  <text x="110" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="-0.5">INID<tspan fill="#06b6d4">.ME</tspan></text>
  <text x="112" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10.5" fill="#38bdf8" letter-spacing="2">NEXT-GEN CONTACT PROTOCOL</text>
</svg>
