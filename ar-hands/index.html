<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <title>inid.me — MediaPipe Hands AI AR Production (v2.1)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100dvh;
    }
    #cameraView {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror camera */
      z-index: 1;
    }
    #threeCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    #handSkeleton {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 3;
      pointer-events: none;
      transform: scaleX(-1);
    }
    /* HUD Overlays */
    .ar-hud-header {
      position: absolute;
      top: 16px; left: 16px; right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: auto;
    }
    .hud-brand {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hud-brand-title {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
    }
    .hud-brand-title span { color: #38bdf8; }
    .hud-badge {
      font-size: 0.68rem;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      padding: 2px 6px;
      border-radius: 6px;
    }
    .hud-metrics {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.78rem;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .hud-fps { color: #10b981; font-weight: 700; }
    
    /* Bottom Gesture State Card */
    .ar-hud-footer {
      position: absolute;
      bottom: 24px; left: 16px; right: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
      pointer-events: auto;
    }
    .gesture-card {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .gesture-icon {
      font-size: 2rem;
      line-height: 1;
      margin-right: 12px;
    }
    .gesture-info h4 {
      font-size: 0.95rem;
      color: #fff;
      margin-bottom: 2px;
    }
    .gesture-info p {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .hud-controls {
      display: flex;
      gap: 8px;
    }
    .btn-ar-ctrl {
      flex: 1;
      height: 42px;
      background: rgba(30, 41, 59, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(8px);
    }
    .btn-ar-ctrl.active {
      background: #38bdf8;
      color: #070a12;
      border-color: #38bdf8;
    }
    #loadingOverlay {
      position: absolute;
      inset: 0;
      background: #070a12;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.4s;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- MediaPipe Hands & Camera Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- Video Feed -->
  <video id="cameraView" playsinline autoplay muted></video>

  <!-- 3D Three.js WebGL Layer -->
  <div id="threeCanvas"></div>

  <!-- Hand Skeleton 2D Canvas Layer -->
  <canvas id="handSkeleton"></canvas>

  <!-- Loading State -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div style="font-weight: 700; font-size: 1rem; color: #fff;">Khởi động AI MediaPipe Hands...</div>
    <div style="font-size: 0.78rem; color: #94a3b8;">Đang nạp mô hình thị giác máy tính & Camera AR</div>
  </div>

  <!-- HUD Header -->
  <div class="ar-hud-header">
    <div class="hud-brand">
      <div class="hud-brand-title">inid<span>.me</span></div>
      <div class="hud-badge" style="background:rgba(16,185,129,0.2); border-color:rgba(16,185,129,0.5); color:#34d399;">PRODUCTION • AI HAND AR</div>
    </div>
    <div class="hud-metrics">
      <span>FPS: <span class="hud-fps" id="txtFps">0</span></span>
      <span>Độ trễ: <span style="color:#38bdf8;" id="txtLatency">0ms</span></span>
    </div>
  </div>

  <!-- HUD Footer -->
  <div class="ar-hud-footer">
    <div class="gesture-card">
      <div style="display:flex; align-items:center;">
        <div class="gesture-icon" id="txtGestureIcon">✋</div>
        <div class="gesture-info">
          <h4 id="txtGestureTitle">Đang tìm bàn tay...</h4>
          <p id="txtGestureDesc">Đưa bàn tay vào trước ống kính để tương tác thẻ AR</p>
        </div>
      </div>
      <div style="font-size: 0.72rem; color: #38bdf8; font-weight: 700;" id="txtCardState">LƠ LỬNG</div>
    </div>

    <div class="hud-controls">
      <button class="btn-ar-ctrl" id="btnSwitchCam">📷 Đổi Cam</button>
      <button class="btn-ar-ctrl" id="btnToggleMesh">🦴 Khớp Xương: BẬT</button>
      <button class="btn-ar-ctrl" id="btnFlipCard">🔄 Lật Thẻ</button>
      <a href="/" class="btn-ar-ctrl" style="text-decoration:none; max-width: 75px;">✕ Thoát</a>
    </div>
  </div>

  <script type="module">
    import { createDynamicCardTexture, VIP_MATERIALS } from '/assets/card-texture-generator.js';

    // Parse active profile from Hash or LocalStorage
    function getActiveProfile() {
      let p = null;
      if (window.location.hash.includes('data=')) {
        try {
          const raw = window.location.hash.split('data=')[1].split('&')[0];
          const binStr = atob(raw);
          const bytes = Uint8Array.from(binStr, m => m.charCodeAt(0));
          const decodedJson = new TextDecoder('utf-8').decode(bytes);
          p = JSON.parse(decodedJson);
        } catch (e) {
          try {
            const raw = window.location.hash.split('data=')[1].split('&')[0];
            p = JSON.parse(decodeURIComponent(atob(raw)));
          } catch (err2) {
            console.warn('Failed to parse profile from hash:', e);
          }
        }
      }
      if (!p) {
        try {
          const stored = localStorage.getItem('inid_ar_profile');
          if (stored) p = JSON.parse(stored);
        } catch (e) {
          console.warn('Failed to read from localStorage:', e);
        }
      }
      return p;
    }
    const activeProfile = getActiveProfile();

    // -------------------------------------------------------------
    // Global Elements & State
    // -------------------------------------------------------------
    const videoElement = document.getElementById('cameraView');
    const skeletonCanvas = document.getElementById('handSkeleton');
    const skelCtx = skeletonCanvas.getContext('2d');
    const loadingOverlay = document.getElementById('loadingOverlay');

    const txtFps = document.getElementById('txtFps');
    const txtLatency = document.getElementById('txtLatency');
    const txtGestureIcon = document.getElementById('txtGestureIcon');
    const txtGestureTitle = document.getElementById('txtGestureTitle');
    const txtGestureDesc = document.getElementById('txtGestureDesc');
    const txtCardState = document.getElementById('txtCardState');
    const btnToggleMesh = document.getElementById('btnToggleMesh');
    const btnFlipCard = document.getElementById('btnFlipCard');

    let showSkeleton = true;
    let cardFlipped = false; // false = Front (0°), true = Back (180°)
    let currentGesture = 'NONE'; // 'NONE' | 'PALM' | 'PINCH' | 'FIST_FLIP' | 'OPEN_FLIP'

    // Continuous Cumulative Y-rotation for Directional 180° Flip (Left-to-Right vs Right-to-Left)
    let targetRotationY = 0; // Cumulative radians: 0, Math.PI, 2*Math.PI, etc.
    let targetRotationX = 0;
    let targetRotationZ = 0;

    // Advanced 3D Palm Pose & Orientation Matrix
    const targetQuaternion = new THREE.Quaternion();
    let isHandTrackingActive = false;

    // OneEuro / Low-pass smoothed coordinates for jitter suppression & responsive tracking
    let filteredHandPos = new THREE.Vector3(0, 0, 0);
    let filteredWristPos = new THREE.Vector3(0, 0, 0);
    let filteredIndexMcp = new THREE.Vector3(0, 0, 0);
    let filteredPinkyMcp = new THREE.Vector3(0, 0, 0);
    let hasInitialPose = false;

    // 4-Finger Grip/Release Flip State Tracking
    // 'EXTENDED' (xòe 4 ngón) vs 'CURLED' (nắm 4 ngón)
    let lastFingerPose = 'UNKNOWN'; // 'EXTENDED' | 'CURLED'
    let consecutivePoseFrames = 0;
    let lastPoseFlipTime = 0;
    const POSE_COOLDOWN_MS = 800; // cooldown giữa các lần nắm/mở để chống giật

    // Flip cooldown & hysteresis
    let lastFlipTime = 0;
    let pinchConsecutiveFrames = 0;
    const PINCH_ON_DIST = 0.05;
    const PINCH_OFF_DIST = 0.08;
    const FLIP_COOLDOWN_MS = 750;

    // Hand zoom baseline
    let baseHandSpan = 0.28;

    // FPS Tracker
    let frameCount = 0;
    let lastFpsTime = performance.now();
    let lastFrameTime = performance.now();
    let lastInferenceStart = performance.now();

    // -------------------------------------------------------------
    // THREE.JS 3D SCENE SETUP
    // -------------------------------------------------------------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.z = 1.5;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('threeCanvas').appendChild(renderer.domElement);

    // Lighting
    const ambLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambLight);

    // Key Light (Ánh sáng chính tạo specular bóng bẩy khi nghiêng thẻ)
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
    keyLight.position.set(1.8, 3.5, 3.0);
    scene.add(keyLight);

    // Fill Light (Ánh sáng xanh cyan công nghệ từ phía đối diện)
    const fillLight = new THREE.DirectionalLight(0x7dd3fc, 0.8);
    fillLight.position.set(-2.5, -1.0, 2.0);
    scene.add(fillLight);

    // Rim / Glint Light (Ánh sáng quét xiên góc từ trên cao, kích hoạt dải phản quang khi xoay 30-60 độ)
    const glintLight = new THREE.DirectionalLight(0xffecd2, 1.2);
    glintLight.position.set(0.2, 4.0, 1.8);
    scene.add(glintLight);

    // -------------------------------------------------------------
    // 3D CARD CREATION (Dual-sided Texture)
    // -------------------------------------------------------------
    const cardGroup = new THREE.Group();
    scene.add(cardGroup);

    // Orientation check: horizontal (0.58m x 0.35m) vs vertical (0.35m x 0.58m)
    const isVertical = activeProfile ? (activeProfile.orientation === 'vertical') : false;
    const CARD_W = isVertical ? 0.35 : 0.58;
    const CARD_H = isVertical ? 0.58 : 0.35;
    const geom = new THREE.BoxGeometry(CARD_W, CARD_H, 0.003);

    // Create dynamic or fallback card texture
    let cardTexture;
    const textureLoader = new THREE.TextureLoader();
    if (activeProfile && (activeProfile.fn || activeProfile.org)) {
      console.log('Rendering dynamic AR card texture for profile:', activeProfile.fn, 'isVertical:', isVertical);
      // Create initial placeholder canvas texture while async image loading finishes
      const placeholderCanvas = document.createElement('canvas');
      placeholderCanvas.width = 1024; placeholderCanvas.height = 1024;
      cardTexture = new THREE.CanvasTexture(placeholderCanvas);

      createDynamicCardTexture(activeProfile, isVertical).then((dynamicCanvas) => {
        cardTexture.image = dynamicCanvas;
        cardTexture.needsUpdate = true;
        console.log('✅ Dynamic AR card texture with images updated!');
      }).catch(err => {
        console.warn('Error generating dynamic texture:', err);
      });
    } else {
      cardTexture = textureLoader.load('/assets/3d/extracted-texture.png?v=20260914-prod', () => {
        console.log('Default 3D Card Texture loaded!');
      });
    }

    // PBR Properties from Pro / VIP Preset
    const vip = activeProfile ? (activeProfile.vipTheme || {}) : {};
    const matKey = (vip.material && VIP_MATERIALS[vip.material]) ? vip.material : 'titanium';
    const pbr = VIP_MATERIALS[matKey];

    const roughnessVal = (typeof pbr.roughness === 'number') ? pbr.roughness : 0.3;
    const metalnessVal = (typeof pbr.metalness === 'number') ? pbr.metalness : 0.1;
    const accentHex = pbr.accent ? parseInt(pbr.accent.replace('#', '0x'), 16) : 0x38bdf8;

    // Custom UV for Front (Top half or Left) and Back (Bottom half or Right)
    const matFront = new THREE.MeshStandardMaterial({
      map: cardTexture,
      roughness: roughnessVal,
      metalness: metalnessVal
    });
    const matBack = new THREE.MeshStandardMaterial({
      map: cardTexture,
      roughness: roughnessVal,
      metalness: metalnessVal
    });
    const matEdge = new THREE.MeshStandardMaterial({ color: accentHex, roughness: 0.2, metalness: 0.6 });

    // Materials: +X, -X, +Y, -Y, +Z (Front), -Z (Back)
    const materials = [
      matEdge, matEdge, matEdge, matEdge,
      matFront, matBack
    ];

    // Adjust UV coordinates for BoxGeometry face 4 (front) & face 5 (back)
    const uvAttr = geom.attributes.uv;
    if (!isVertical) {
      // Horizontal UV: X: 82..942, Front Y: 0..520, Back Y: 504..1024
      const uMin = 82 / 1024;
      const uMax = 942 / 1024;
      const vFrontTop = 1.0;
      const vFrontBottom = 504 / 1024;

      uvAttr.setXY(16, uMin, vFrontTop);
      uvAttr.setXY(17, uMax, vFrontTop);
      uvAttr.setXY(18, uMin, vFrontBottom);
      uvAttr.setXY(19, uMax, vFrontBottom);

      const vBackTop = 520 / 1024;
      const vBackBottom = 0.0;
      uvAttr.setXY(20, uMin, vBackTop);
      uvAttr.setXY(21, uMax, vBackTop);
      uvAttr.setXY(22, uMin, vBackBottom);
      uvAttr.setXY(23, uMax, vBackBottom);
    } else {
      // Vertical UV:
      // Front (Left):  X: 20..500, Y: 115..909
      // Back (Right):  X: 524..1004, Y: 115..909
      const uFrontMin = 20 / 1024, uFrontMax = 500 / 1024;
      const uBackMin = 524 / 1024, uBackMax = 1004 / 1024;
      const vTop = (1024 - 115) / 1024;    // 0.8877
      const vBottom = (1024 - 909) / 1024; // 0.1123

      uvAttr.setXY(16, uFrontMin, vTop);
      uvAttr.setXY(17, uFrontMax, vTop);
      uvAttr.setXY(18, uFrontMin, vBottom);
      uvAttr.setXY(19, uFrontMax, vBottom);

      uvAttr.setXY(20, uBackMin, vTop);
      uvAttr.setXY(21, uBackMax, vTop);
      uvAttr.setXY(22, uBackMin, vBottom);
      uvAttr.setXY(23, uBackMax, vBottom);
    }
    uvAttr.needsUpdate = true;

    const cardMesh = new THREE.Mesh(geom, materials);
    cardGroup.add(cardMesh);

    // Expose for verification and inspection
    window._arScene = scene;
    window._arCardMesh = cardMesh;
    window._arActiveProfile = activeProfile;
    window._arCardTexture = cardTexture;

    // Target positions for smooth dampening
    const targetPos = new THREE.Vector3(0, -0.05, 0);
    const targetRot = new THREE.Euler(0, 0, 0);
    let targetScale = 1.0;

    // -------------------------------------------------------------
    // GESTURE RECOGNITION LOGIC
    // -------------------------------------------------------------
    function dist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y, (p1.z || 0) - (p2.z || 0));
    }

    
    // Detect 4 fingers status (Index 8, Middle 12, Ring 16, Pinky 20 relative to PIPs 6,10,14,18)
    function analyzeFourFingers(lm) {
      const fingers = [
        { tip: 8, pip: 6 },
        { tip: 12, pip: 10 },
        { tip: 16, pip: 14 },
        { tip: 20, pip: 18 }
      ];
      let extCount = 0;
      let curlCount = 0;
      fingers.forEach(f => {
        const dTip = dist(lm[0], lm[f.tip]);
        const dPip = dist(lm[0], lm[f.pip]);
        if (dTip > dPip * 1.08) extCount++;
        else if (dTip < dPip * 0.98) curlCount++;
      });
      return {
        isExtended: extCount >= 3,
        isCurled: curlCount >= 3
      };
    }

    function onResults(results) {
      const latency = Math.round(performance.now() - lastInferenceStart);
      txtLatency.textContent = latency + 'ms';

      // Resize skeleton canvas
      skeletonCanvas.width = window.innerWidth;
      skeletonCanvas.height = window.innerHeight;
      skelCtx.clearRect(0, 0, skeletonCanvas.width, skeletonCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];

        // Draw Skeleton if enabled
        if (showSkeleton) {
          drawHandSkeleton(lm, skelCtx, skeletonCanvas.width, skeletonCanvas.height);
        }

        // 1. PINCH DETECTION (Thumb tip 4 to Index tip 8)
        const pinchDist = dist(lm[4], lm[8]);
        const isPinching = pinchDist < 0.07;

        // 2. PALM OPEN DETECTION (Fingers extended from wrist 0)
        const isIndexOpen = lm[8].y < lm[6].y;
        const isMiddleOpen = lm[12].y < lm[10].y;
        const isRingOpen = lm[16].y < lm[14].y;
        const isPinkyOpen = lm[20].y < lm[18].y;
        const isOpenPalm = isIndexOpen && isMiddleOpen && isRingOpen && isPinkyOpen && !isPinching;

        // Coordinates mapping to Three.js space
        // Mirror X because camera is mirrored
        const handX = (0.5 - lm[9].x) * 2.2;
        const handY = (0.5 - lm[9].y) * 1.5;
        const pinchX = (0.5 - (lm[4].x + lm[8].x) / 2) * 2.2;
        const pinchY = (0.5 - (lm[4].y + lm[8].y) / 2) * 1.5;

        // 3. DYNAMIC DISTANCE & ZOOM CALCULATION (Hand Distance & Spread)
        // Measure span between Wrist (0) and Middle Tip (12)
        const currentHandSpan = dist(lm[0], lm[12]);
        // Also measure 5-finger spread (Thumb tip 4 to Pinky tip 20)
        const fingerSpread = dist(lm[4], lm[20]);

        // Hand closer to camera (larger span) -> zoom in (scale up to 1.5x / 150% max)
        // Hand further away -> zoom out (scale down to 0.7x / 70% min) smoothly
        const rawZoomRatio = Math.max(0.70, Math.min(1.50, (currentHandSpan / baseHandSpan)));
        const dynamicCardScale = rawZoomRatio;

        // 4. KIỂM TRA ĐỘNG TÁC NẮM TAY (CURL) ĐỂ LẬT THẺ TIẾP TỤC 180° CÙNG CHIỀU VỀ MẶT TRƯỚC/MẶT SAU
        const now = performance.now();
        const fourFingers = analyzeFourFingers(lm);

        // Mỗi lần nắm 4 ngón tay (CURLED), lật tiếp 180° (Math.PI) theo đúng chiều vừa xoay
        if (fourFingers.isCurled) {
          if (lastFingerPose === 'EXTENDED' && (now - lastPoseFlipTime > POSE_COOLDOWN_MS)) {
            consecutivePoseFrames++;
            if (consecutivePoseFrames >= 3) {
              targetRotationY += Math.PI; // Tiếp tục quay thêm 180° cùng chiều
              cardFlipped = !cardFlipped;
              lastPoseFlipTime = now;
              lastFingerPose = 'CURLED';
              consecutivePoseFrames = 0;
              btnFlipCard.textContent = cardFlipped ? '🔄 Mặt Sau' : '🔄 Mặt Trước';
            }
          } else {
            lastFingerPose = 'CURLED';
          }
        }
        else if (fourFingers.isExtended) {
          lastFingerPose = 'EXTENDED';
        }

        // 5. CỬ CHỈ PINCH DỰ PHÒNG (Kẹp ngón trỏ & cái)
        const isPinchCandidate = (pinchDist < PINCH_ON_DIST);
        if (isPinchCandidate) {
          pinchConsecutiveFrames++;
          if (pinchConsecutiveFrames >= 3 && (now - lastFlipTime > FLIP_COOLDOWN_MS)) {
            targetRotationY += Math.PI;
            cardFlipped = !cardFlipped;
            lastFlipTime = now;
            btnFlipCard.textContent = cardFlipped ? '🔄 Mặt Sau' : '🔄 Mặt Trước';
          }
        } else if (pinchDist > PINCH_OFF_DIST) {
          pinchConsecutiveFrames = 0;
        }

        // ---------------------------------------------------------
        // 3D PALM POSE & ADAPTIVE ORIENTATION MATRIX
        // ---------------------------------------------------------
        // Palm Center: interpolated between Wrist(0), IndexMCP(5), PinkyMCP(17)
        const rawPalmX = (wrist.x + indexMcp.x + pinkyMcp.x) / 3;
        const rawPalmY = (wrist.y + indexMcp.y + pinkyMcp.y) / 3;
        const rawPalmZ = (wrist.z + indexMcp.z + pinkyMcp.z) / 3;

        // Map to 3D Space (Three.js camera coordinates)
        const currentPalmPos = new THREE.Vector3(
          (rawPalmX - 0.5) * 2.2,
          -(rawPalmY - 0.5) * 1.6,
          -rawPalmZ * 1.5
        );
        const currentWrist = new THREE.Vector3(
          (wrist.x - 0.5) * 2.2,
          -(wrist.y - 0.5) * 1.6,
          -wrist.z * 1.5
        );
        const currentIndex = new THREE.Vector3(
          (indexMcp.x - 0.5) * 2.2,
          -(indexMcp.y - 0.5) * 1.6,
          -indexMcp.z * 1.5
        );
        const currentPinky = new THREE.Vector3(
          (pinkyMcp.x - 0.5) * 2.2,
          -(pinkyMcp.y - 0.5) * 1.6,
          -pinkyMcp.z * 1.5
        );

        if (!hasInitialPose) {
          filteredHandPos.copy(currentPalmPos);
          filteredWristPos.copy(currentWrist);
          filteredIndexMcp.copy(currentIndex);
          filteredPinkyMcp.copy(currentPinky);
          hasInitialPose = true;
        } else {
          // Adaptive Smoothing: Giảm lag khi di chuyển nhanh, triệt tiêu rung (jitter) khi giữ yên
          const deltaPos = currentPalmPos.distanceTo(filteredHandPos);
          const filterAlpha = THREE.MathUtils.clamp(0.25 + deltaPos * 1.8, 0.20, 0.75);
          filteredHandPos.lerp(currentPalmPos, filterAlpha);
          filteredWristPos.lerp(currentWrist, filterAlpha);
          filteredIndexMcp.lerp(currentIndex, filterAlpha);
          filteredPinkyMcp.lerp(currentPinky, filterAlpha);
        }

        // Xây dựng hệ trục chuẩn Orthonormal 3D Basis của lòng bàn tay
        // V_Up: Từ Cổ tay (Wrist) hướng lên gốc ngón tay (Index MCP & Pinky MCP)
        const vUp = new THREE.Vector3().addVectors(filteredIndexMcp, filteredPinkyMcp).multiplyScalar(0.5).sub(filteredWristPos).normalize();
        
        // V_Right: Từ gốc ngón út (Pinky) sang gốc ngón trỏ (Index)
        const vRight = new THREE.Vector3().subVectors(filteredIndexMcp, filteredPinkyMcp).normalize();
        
        // V_Normal: Pháp tuyến vuông góc lòng bàn tay = V_Right x V_Up
        const vNormal = new THREE.Vector3().crossVectors(vRight, vUp).normalize();
        
        // Đảm bảo tính trực giao hoàn hảo (Orthonormal)
        vRight.crossVectors(vUp, vNormal).normalize();

        // Ma trận xoay của lòng bàn tay
        const palmRotMatrix = new THREE.Matrix4().makeBasis(vRight, vUp, vNormal);
        const palmQuat = new THREE.Quaternion().setFromRotationMatrix(palmRotMatrix);

        // Áp dụng góc lật 180 độ (Card Flip) lên trục Y cục bộ của thẻ
        const flipQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), targetRotationY);
        targetQuaternion.copy(palmQuat).multiply(flipQuat);
        isHandTrackingActive = true;

        if (fourFingers.isCurled) {
          // --- GESTURE: NẮM 4 NGÓN (FIST / GRIP) ---
          currentGesture = 'FIST_FLIP';
          txtGestureIcon.textContent = '✊';
          txtGestureTitle.textContent = 'Nắm 4 Ngón: Lật Trái ➔ Phải';
          txtGestureDesc.textContent = cardFlipped ? 'Đã lật sang Mặt Sau | Mở 4 ngón để lật ngược lại' : 'Đã lật sang Mặt Trước | Mở 4 ngón để lật ngược lại';
          txtCardState.textContent = 'NẮM 4 NGÓN';
          txtCardState.style.color = '#f43f5e';

          targetPos.copy(filteredHandPos);
          targetScale = dynamicCardScale * 0.95;

        } else if (isOpenPalm) {
          // --- GESTURE: XÒE LÒNG BÀN TAY (OPEN PALM ANCHOR & ZOOM) ---
          currentGesture = 'PALM';
          txtGestureIcon.textContent = '🖐️';
          txtGestureTitle.textContent = 'Xòe Lòng Bàn Tay: Thẻ Nổi 3D';
          txtGestureDesc.textContent = 'Đưa tay lại gần/xa để thu phóng (Zoom: ' + Math.min(150, Math.round(dynamicCardScale * 100)) + '%) | Nắm 4 ngón để lật thẻ';
          txtCardState.textContent = 'THU PHÓNG TAY';
          txtCardState.style.color = '#10b981';

          // Đặt thẻ bám khít và nổi nhẹ 2cm ngay trên lòng bàn tay
          const hoverOffset = vNormal.clone().multiplyScalar(0.04);
          targetPos.copy(filteredHandPos).add(hoverOffset);
          targetScale = Math.min(1.50, dynamicCardScale * 1.05);

        } else {
          // Neutral hand position
          currentGesture = 'HOVER';
          txtGestureIcon.textContent = '👋';
          txtGestureTitle.textContent = 'Bàn Tay Tương Tác';
          txtGestureDesc.textContent = 'Nắm/Mở 4 ngón để lật thẻ Trái ⇄ Phải | Tiến/Lùi để thu phóng 70%-150%';
          txtCardState.textContent = 'SẴN SÀNG';
          txtCardState.style.color = '#38bdf8';

          targetPos.copy(filteredHandPos);
          targetScale = dynamicCardScale;
        }

      } else {
        // No hand visible -> idle float
        currentGesture = 'NONE';
        isHandTrackingActive = false;
        hasInitialPose = false;
        txtGestureIcon.textContent = '✋';
        txtGestureTitle.textContent = 'Chờ Đưa Bàn Tay Vào...';
        txtGestureDesc.textContent = 'Đưa bàn tay vào trước camera để AI kích hoạt tương tác';
        txtCardState.textContent = 'CHỜ BÀN TAY';
        txtCardState.style.color = '#94a3b8';

        // Gentle idle floating animation
        const time = performance.now() * 0.0015;
        targetPos.set(0, Math.sin(time) * 0.04, 0);
        targetRotationX = Math.sin(time * 0.8) * 0.06;
        targetRotationZ = Math.cos(time * 0.7) * 0.04;
        targetScale = 1.0;
      }
    }

    // -------------------------------------------------------------
    // DRAW SKELETON WIREFRAME ON 2D CANVAS
    // -------------------------------------------------------------
    const CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4], // Thumb
      [0,5],[5,6],[6,7],[7,8], // Index
      [5,9],[9,10],[10,11],[11,12], // Middle
      [9,13],[13,14],[14,15],[15,16], // Ring
      [13,17],[17,18],[18,19],[19,20], // Pinky
      [0,17] // Palm base
    ];

    function drawHandSkeleton(lm, ctx, w, h) {
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.8)';
      ctx.lineWidth = 3;

      CONNECTIONS.forEach(([i, j]) => {
        ctx.beginPath();
        ctx.moveTo(lm[i].x * w, lm[i].y * h);
        ctx.lineTo(lm[j].x * w, lm[j].y * h);
        ctx.stroke();
      });

      // Joint points
      lm.forEach((pt, idx) => {
        ctx.beginPath();
        ctx.arc(pt.x * w, pt.y * h, idx === 4 || idx === 8 ? 6 : 4, 0, Math.PI * 2);
        ctx.fillStyle = (idx === 4 || idx === 8) ? '#f43f5e' : '#38bdf8';
        ctx.fill();
      });
    }

    // -------------------------------------------------------------
    // ANIMATION & INTERPOLATION LOOP
    // -------------------------------------------------------------
    function animate() {
      requestAnimationFrame(animate);

      // Smooth exponential dampening (Frame-rate independent: tau = 0.10s)
      const nowMs = performance.now();
      const dt = Math.min(0.05, (nowMs - lastFrameTime) * 0.001);
      lastFrameTime = nowMs;
      const smoothFactor = 1 - Math.exp(-dt / 0.09);
      const rotSmoothFactor = 1 - Math.exp(-dt / 0.07);

      cardGroup.position.lerp(targetPos, smoothFactor);
      cardGroup.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), smoothFactor);

      if (isHandTrackingActive) {
        // Slerp Quaternion 3D: khử hoàn toàn rung giật (jitter), phản hồi mượt mà theo chuyển động cổ tay 0 - 60 độ
        cardGroup.quaternion.slerp(targetQuaternion, rotSmoothFactor);
      } else {
        const flipSmoothFactor = 1 - Math.exp(-dt / 0.18);
        cardGroup.rotation.x += (targetRotationX - cardGroup.rotation.x) * smoothFactor;
        cardGroup.rotation.y += (targetRotationY - cardGroup.rotation.y) * flipSmoothFactor;
        cardGroup.rotation.z += (targetRotationZ - cardGroup.rotation.z) * smoothFactor;
      }

      renderer.render(scene, camera);

      // FPS Counter
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        txtFps.textContent = frameCount;
        frameCount = 0;
        lastFpsTime = now;
      }
    }

    // -------------------------------------------------------------
    // MEDIAPIPE INITIALIZATION
    // -------------------------------------------------------------
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults(onResults);

    let currentFacingMode = 'environment'; // 'user' (front) | 'environment' (back)
    let cameraFeed = null;

    function initCamera(facing) {
      // Check Secure Context & MediaDevices support (required for Camera on iOS/Android)
      if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return Promise.reject(new Error('Yêu cầu HTTPS để truy cập Camera. Vui lòng mở trang qua https://'));
      }

      if (cameraFeed) {
        try { cameraFeed.stop(); } catch(e){}
      }

      currentFacingMode = facing;
      const isFront = (currentFacingMode === 'user');
      
      // Mirror video only on front camera
      videoElement.style.transform = isFront ? 'scaleX(-1)' : 'none';
      skeletonCanvas.style.transform = isFront ? 'scaleX(-1)' : 'none';

      cameraFeed = new Camera(videoElement, {
        onFrame: async () => {
          lastInferenceStart = performance.now();
          await hands.send({ image: videoElement });
        },
        facingMode: { ideal: currentFacingMode },
        width: 1280,
        height: 720
      });

      return cameraFeed.start();
    }

    let isSimulating = false;

    function startSimulationMode(reason) {
      isSimulating = true;
      console.log('Starting Interactive Simulation Mode:', reason);
      loadingOverlay.style.opacity = '0';
      setTimeout(() => loadingOverlay.style.display = 'none', 400);

      if (!isSimulating) {
        animate();
      }

      const isHttps = window.location.protocol === 'https:';
      if (!isHttps && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        txtGestureTitle.textContent = 'Cần mở bằng HTTPS để bật Camera';
        txtGestureDesc.textContent = 'Trình duyệt chặn Camera khi dùng http:// (IP). Vui lòng mở qua HTTPS (ví dụ https://inid.me hoặc Tunnel HTTPS).';
      } else {
        txtGestureTitle.textContent = 'Chế Độ Thử Nghiệm Chuột / Cảm Ứng';
        txtGestureDesc.textContent = 'Rê chuột/chạm = Di chuyển | Nhấn giữ/chạm = Kẹp ngón tay | Thả = Xòe bàn tay';
      }
      txtCardState.textContent = 'MÔ PHỎNG TAY';
      txtCardState.style.color = '#38bdf8';

      let isMouseDown = false;

      function simulateHand(clientX, clientY, isPinch) {
        const normX = clientX / window.innerWidth;
        const normY = clientY / window.innerHeight;

        // Generate synthetic 21 landmarks
        const mockLm = [];
        for (let i = 0; i <= 20; i++) mockLm.push({ x: normX, y: normY, z: 0 });

        mockLm[0] = { x: normX, y: Math.min(1, normY + 0.2), z: 0 };
        mockLm[9] = { x: normX, y: normY, z: -0.05 };

        if (isPinch) {
          // Pinch
          mockLm[4] = { x: normX - 0.01, y: normY, z: 0 };
          mockLm[8] = { x: normX + 0.01, y: normY, z: 0 };
          mockLm[12] = { x: normX, y: normY - 0.1, z: 0 };
        } else {
          // Open Palm
          mockLm[4] = { x: normX - 0.1, y: normY - 0.05, z: 0 };
          mockLm[8] = { x: normX - 0.04, y: normY - 0.18, z: 0 };
          mockLm[6] = { x: normX - 0.04, y: normY - 0.1, z: 0 };
          mockLm[12] = { x: normX, y: normY - 0.2, z: 0 };
          mockLm[10] = { x: normX, y: normY - 0.12, z: 0 };
          mockLm[16] = { x: normX + 0.04, y: normY - 0.17, z: 0 };
          mockLm[14] = { x: normX + 0.04, y: normY - 0.09, z: 0 };
          mockLm[20] = { x: normX + 0.08, y: normY - 0.13, z: 0 };
          mockLm[18] = { x: normX + 0.08, y: normY - 0.07, z: 0 };
        }

        onResults({ multiHandLandmarks: [mockLm] });
      }

      window.addEventListener('mousemove', (e) => {
        simulateHand(e.clientX, e.clientY, isMouseDown);
      });

      window.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        simulateHand(e.clientX, e.clientY, true);
      });

      window.addEventListener('mouseup', (e) => {
        isMouseDown = false;
        simulateHand(e.clientX, e.clientY, false);
      });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          simulateHand(e.touches[0].clientX, e.touches[0].clientY, isMouseDown);
        }
      });
      window.addEventListener('touchstart', (e) => {
        isMouseDown = true;
        if (e.touches.length > 0) simulateHand(e.touches[0].clientX, e.touches[0].clientY, true);
      });
      window.addEventListener('touchend', () => {
        isMouseDown = false;
      });

      // Initial hand position
      simulateHand(window.innerWidth / 2, window.innerHeight / 2, false);
    }

    initCamera(currentFacingMode).then(() => {
      console.log('Camera started successfully with facingMode:', currentFacingMode);
      loadingOverlay.style.opacity = '0';
      setTimeout(() => loadingOverlay.style.display = 'none', 400);
      animate();
    }).catch(err => {
      console.warn('Camera not available, falling back to Simulation Mode:', err);
      startSimulationMode(err.message);
    });

    const btnSwitchCam = document.getElementById('btnSwitchCam');
    if (btnSwitchCam) {
      btnSwitchCam.onclick = () => {
        const nextFacing = currentFacingMode === 'user' ? 'environment' : 'user';
        btnSwitchCam.textContent = nextFacing === 'user' ? '📷 Cam: Trước' : '📷 Cam: Sau';
        initCamera(nextFacing).catch(e => {
          console.warn('Switch camera error:', e);
        });
      };
    }

    // -------------------------------------------------------------
    // CONTROLS & EVENTS
    // -------------------------------------------------------------
    btnToggleMesh.onclick = () => {
      showSkeleton = !showSkeleton;
      btnToggleMesh.textContent = `🦴 Khớp Xương: ${showSkeleton ? 'BẬT' : 'TẮT'}`;
      btnToggleMesh.classList.toggle('active', showSkeleton);
    };

    btnFlipCard.onclick = () => {
      cardFlipped = !cardFlipped;
      targetRotationY += Math.PI; // Tiếp tục xoay tiếp 180° cùng chiều
      btnFlipCard.textContent = cardFlipped ? '🔄 Mặt Sau' : '🔄 Mặt Trước';
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
