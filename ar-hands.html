<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>inid.me — MediaPipe Hands AI AR Production (v2.1)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100dvh;
    }
    #cameraView {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror camera */
      z-index: 1;
    }
    #threeCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    #handSkeleton {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 3;
      pointer-events: none;
      transform: scaleX(-1);
    }
    /* HUD Overlays */
    .ar-hud-header {
      position: absolute;
      top: 16px; left: 16px; right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: auto;
    }
    .hud-brand {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hud-brand-title {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
    }
    .hud-brand-title span { color: #38bdf8; }
    .hud-badge {
      font-size: 0.68rem;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      padding: 2px 6px;
      border-radius: 6px;
    }
    .hud-metrics {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.78rem;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .hud-fps { color: #10b981; font-weight: 700; }
    
    /* Bottom Gesture State Card */
    .ar-hud-footer {
      position: absolute;
      bottom: 24px; left: 16px; right: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
      pointer-events: auto;
    }
    .gesture-card {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .gesture-icon {
      font-size: 2rem;
      line-height: 1;
      margin-right: 12px;
    }
    .gesture-info h4 {
      font-size: 0.95rem;
      color: #fff;
      margin-bottom: 2px;
    }
    .gesture-info p {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .hud-controls {
      display: flex;
      gap: 8px;
    }
    .btn-ar-ctrl {
      flex: 1;
      height: 42px;
      background: rgba(30, 41, 59, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(8px);
    }
    .btn-ar-ctrl.active {
      background: #38bdf8;
      color: #070a12;
      border-color: #38bdf8;
    }
    #loadingOverlay {
      position: absolute;
      inset: 0;
      background: #070a12;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.4s;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- MediaPipe Hands & Camera Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- Video Feed -->
  <video id="cameraView" playsinline autoplay muted></video>

  <!-- 3D Three.js WebGL Layer -->
  <div id="threeCanvas"></div>

  <!-- Hand Skeleton 2D Canvas Layer -->
  <canvas id="handSkeleton"></canvas>

  <!-- Loading State -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div style="font-weight: 700; font-size: 1rem; color: #fff;">Khởi động AI MediaPipe Hands...</div>
    <div style="font-size: 0.78rem; color: #94a3b8;">Đang nạp mô hình thị giác máy tính & Camera AR</div>
  </div>

  <!-- HUD Header -->
  <div class="ar-hud-header">
    <div class="hud-brand">
      <div class="hud-brand-title">inid<span>.me</span></div>
      <div class="hud-badge" style="background:rgba(16,185,129,0.2); border-color:rgba(16,185,129,0.5); color:#34d399;">PRODUCTION • AI HAND AR</div>
    </div>
    <div class="hud-metrics">
      <span>FPS: <span class="hud-fps" id="txtFps">0</span></span>
      <span>Độ trễ: <span style="color:#38bdf8;" id="txtLatency">0ms</span></span>
    </div>
  </div>

  <!-- HUD Footer -->
  <div class="ar-hud-footer">
    <div class="gesture-card">
      <div style="display:flex; align-items:center;">
        <div class="gesture-icon" id="txtGestureIcon">✋</div>
        <div class="gesture-info">
          <h4 id="txtGestureTitle">Đang tìm bàn tay...</h4>
          <p id="txtGestureDesc">Đưa bàn tay vào trước ống kính để tương tác thẻ AR</p>
        </div>
      </div>
      <div style="font-size: 0.72rem; color: #38bdf8; font-weight: 700;" id="txtCardState">LƠ LỬNG</div>
    </div>

    <div class="hud-controls">
      <button class="btn-ar-ctrl" id="btnSwitchCam">📷 Đổi Cam</button>
      <button class="btn-ar-ctrl" id="btnToggleMesh">🦴 Khớp Xương: BẬT</button>
      <button class="btn-ar-ctrl" id="btnFlipCard">🔄 Lật Thẻ</button>
      <a href="/" class="btn-ar-ctrl" style="text-decoration:none; max-width: 75px;">✕ Thoát</a>
    </div>
  </div>

  <script type="module">
    import { createDynamicCardTexture } from '/assets/card-texture-generator.js';

    // Parse active profile from Hash or LocalStorage
    function getActiveProfile() {
      let p = null;
      if (window.location.hash.includes('data=')) {
        try {
          const raw = window.location.hash.split('data=')[1].split('&')[0];
          const binStr = atob(raw);
          const bytes = Uint8Array.from(binStr, m => m.charCodeAt(0));
          const decodedJson = new TextDecoder('utf-8').decode(bytes);
          p = JSON.parse(decodedJson);
        } catch (e) {
          try {
            const raw = window.location.hash.split('data=')[1].split('&')[0];
            p = JSON.parse(decodeURIComponent(atob(raw)));
          } catch (err2) {
            console.warn('Failed to parse profile from hash:', e);
          }
        }
      }
      if (!p) {
        try {
          const stored = localStorage.getItem('inid_ar_profile');
          if (stored) p = JSON.parse(stored);
        } catch (e) {
          console.warn('Failed to read from localStorage:', e);
        }
      }
      return p;
    }
    const activeProfile = getActiveProfile();

    // -------------------------------------------------------------
    // Global Elements & State
    // -------------------------------------------------------------
    const videoElement = document.getElementById('cameraView');
    const skeletonCanvas = document.getElementById('handSkeleton');
    const skelCtx = skeletonCanvas.getContext('2d');
    const loadingOverlay = document.getElementById('loadingOverlay');

    const txtFps = document.getElementById('txtFps');
    const txtLatency = document.getElementById('txtLatency');
    const txtGestureIcon = document.getElementById('txtGestureIcon');
    const txtGestureTitle = document.getElementById('txtGestureTitle');
    const txtGestureDesc = document.getElementById('txtGestureDesc');
    const txtCardState = document.getElementById('txtCardState');
    const btnToggleMesh = document.getElementById('btnToggleMesh');
    const btnFlipCard = document.getElementById('btnFlipCard');

    let showSkeleton = true;
    let cardFlipped = false; // false = Front (0°), true = Back (180°)
    let currentGesture = 'NONE'; // 'NONE' | 'PALM' | 'PINCH' | 'FIST_FLIP' | 'OPEN_FLIP'

    // Continuous Cumulative Y-rotation for Directional 180° Flip (Left-to-Right vs Right-to-Left)
    let targetRotationY = 0; // Cumulative radians: 0, Math.PI, 2*Math.PI, etc.
    let targetRotationX = 0;
    let targetRotationZ = 0;

    // 4-Finger Grip/Release Flip State Tracking
    // 'EXTENDED' (xòe 4 ngón) vs 'CURLED' (nắm 4 ngón)
    let lastFingerPose = 'UNKNOWN'; // 'EXTENDED' | 'CURLED'
    let consecutivePoseFrames = 0;
    let lastPoseFlipTime = 0;
    const POSE_COOLDOWN_MS = 800; // cooldown giữa các lần nắm/mở để chống giật

    // Flip cooldown & hysteresis
    let lastFlipTime = 0;
    let pinchConsecutiveFrames = 0;
    const PINCH_ON_DIST = 0.05;
    const PINCH_OFF_DIST = 0.08;
    const FLIP_COOLDOWN_MS = 750;

    // Hand zoom baseline
    let baseHandSpan = 0.28;

    // FPS Tracker
    let frameCount = 0;
    let lastFpsTime = performance.now();
    let lastFrameTime = performance.now();
    let lastInferenceStart = performance.now();

    // -------------------------------------------------------------
    // THREE.JS 3D SCENE SETUP
    // -------------------------------------------------------------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.z = 1.5;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('threeCanvas').appendChild(renderer.domElement);

    // Lighting
    const ambLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambLight);
    const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.0);
    dirLight.position.set(2, 4, 3);
    scene.add(dirLight);

    // -------------------------------------------------------------
    // 3D CARD CREATION (Dual-sided Texture)
    // -------------------------------------------------------------
    const cardGroup = new THREE.Group();
    scene.add(cardGroup);

    // Standard Business card ratio: 0.91m x 0.55m -> scale down to 0.28m x 0.17m in AR space
    const CARD_W = 0.58;
    const CARD_H = 0.35;
    const geom = new THREE.BoxGeometry(CARD_W, CARD_H, 0.003);

    // Create dynamic or fallback card texture
    let cardTexture;
    if (activeProfile && (activeProfile.fn || activeProfile.org)) {
      console.log('Rendering dynamic AR card texture for profile:', activeProfile.fn);
      const dynamicCanvas = createDynamicCardTexture(activeProfile, false);
      cardTexture = new THREE.CanvasTexture(dynamicCanvas);
      cardTexture.needsUpdate = true;
    } else {
      const textureLoader = new THREE.TextureLoader();
      cardTexture = textureLoader.load('/assets/3d/extracted-texture.png?v=20260914-prod', () => {
        console.log('Default 3D Card Texture loaded!');
      });
    }

    // Custom UV for Front (Top half) and Back (Bottom half)
    const matFront = new THREE.MeshStandardMaterial({
      map: cardTexture,
      roughness: 0.3,
      metalness: 0.1
    });
    const matBack = new THREE.MeshStandardMaterial({
      map: cardTexture,
      roughness: 0.3,
      metalness: 0.1
    });
    const matEdge = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.2, metalness: 0.5 });

    // Materials: +X, -X, +Y, -Y, +Z (Front), -Z (Back)
    const materials = [
      matEdge, matEdge, matEdge, matEdge,
      matFront, matBack
    ];

    // Adjust UV coordinates for BoxGeometry face 4 (front) & face 5 (back)
    // Texture is 1024x1024 with card bounds: X: 82..942, Front Y: 0..520, Back Y: 504..1024
    const uvAttr = geom.attributes.uv;
    const uMin = 82 / 1024;
    const uMax = 942 / 1024;
    const vFrontTop = 1.0;
    const vFrontBottom = 504 / 1024; // (1024 - 520) / 1024 = 0.4921875

    // Front face (index 16..19 in BoxGeometry)
    uvAttr.setXY(16, uMin, vFrontTop);
    uvAttr.setXY(17, uMax, vFrontTop);
    uvAttr.setXY(18, uMin, vFrontBottom);
    uvAttr.setXY(19, uMax, vFrontBottom);

    // Back face (index 20..23) -> Un-mirrored: text reads normally from back
    const vBackTop = 520 / 1024;    // (1024 - 504) / 1024 = 0.5078125
    const vBackBottom = 0.0;
    uvAttr.setXY(20, uMin, vBackTop);
    uvAttr.setXY(21, uMax, vBackTop);
    uvAttr.setXY(22, uMin, vBackBottom);
    uvAttr.setXY(23, uMax, vBackBottom);
    uvAttr.needsUpdate = true;

    const cardMesh = new THREE.Mesh(geom, materials);
    cardGroup.add(cardMesh);

    // Expose for verification and inspection
    window._arScene = scene;
    window._arCardMesh = cardMesh;
    window._arActiveProfile = activeProfile;
    window._arCardTexture = cardTexture;

    // Target positions for smooth dampening
    const targetPos = new THREE.Vector3(0, -0.05, 0);
    const targetRot = new THREE.Euler(0, 0, 0);
    let targetScale = 1.0;

    // -------------------------------------------------------------
    // GESTURE RECOGNITION LOGIC
    // -------------------------------------------------------------
    function dist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y, (p1.z || 0) - (p2.z || 0));
    }

    
    // Detect 4 fingers status (Index 8, Middle 12, Ring 16, Pinky 20 relative to PIPs 6,10,14,18)
    function analyzeFourFingers(lm) {
      const fingers = [
        { tip: 8, pip: 6 },
        { tip: 12, pip: 10 },
        { tip: 16, pip: 14 },
        { tip: 20, pip: 18 }
      ];
      let extCount = 0;
      let curlCount = 0;
      fingers.forEach(f => {
        const dTip = dist(lm[0], lm[f.tip]);
        const dPip = dist(lm[0], lm[f.pip]);
        if (dTip > dPip * 1.08) extCount++;
        else if (dTip < dPip * 0.98) curlCount++;
      });
      return {
        isExtended: extCount >= 3,
        isCurled: curlCount >= 3
      };
    }

    function onResults(results) {
      const latency = Math.round(performance.now() - lastInferenceStart);
      txtLatency.textContent = latency + 'ms';

      // Resize skeleton canvas
      skeletonCanvas.width = window.innerWidth;
      skeletonCanvas.height = window.innerHeight;
      skelCtx.clearRect(0, 0, skeletonCanvas.width, skeletonCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];

        // Draw Skeleton if enabled
        if (showSkeleton) {
          drawHandSkeleton(lm, skelCtx, skeletonCanvas.width, skeletonCanvas.height);
        }

        // 1. PINCH DETECTION (Thumb tip 4 to Index tip 8)
        const pinchDist = dist(lm[4], lm[8]);
        const isPinching = pinchDist < 0.07;

        // 2. PALM OPEN DETECTION (Fingers extended from wrist 0)
        const isIndexOpen = lm[8].y < lm[6].y;
        const isMiddleOpen = lm[12].y < lm[10].y;
        const isRingOpen = lm[16].y < lm[14].y;
        const isPinkyOpen = lm[20].y < lm[18].y;
        const isOpenPalm = isIndexOpen && isMiddleOpen && isRingOpen && isPinkyOpen && !isPinching;

        // Coordinates mapping to Three.js space
        // Mirror X because camera is mirrored
        const handX = (0.5 - lm[9].x) * 2.2;
        const handY = (0.5 - lm[9].y) * 1.5;
        const pinchX = (0.5 - (lm[4].x + lm[8].x) / 2) * 2.2;
        const pinchY = (0.5 - (lm[4].y + lm[8].y) / 2) * 1.5;

        // 3. DYNAMIC DISTANCE & ZOOM CALCULATION (Hand Distance & Spread)
        // Measure span between Wrist (0) and Middle Tip (12)
        const currentHandSpan = dist(lm[0], lm[12]);
        // Also measure 5-finger spread (Thumb tip 4 to Pinky tip 20)
        const fingerSpread = dist(lm[4], lm[20]);

        // Hand closer to camera (larger span) -> zoom in (scale up to 1.5x / 150% max)
        // Hand further away -> zoom out (scale down to 0.7x / 70% min) smoothly
        const rawZoomRatio = Math.max(0.70, Math.min(1.50, (currentHandSpan / baseHandSpan)));
        const dynamicCardScale = rawZoomRatio;

        // 4. KIỂM TRA ĐỘNG TÁC NẮM / MỞ 4 NGÓN TAY ĐỂ LẬT THẺ 180° CÓ HƯỚNG
        const now = performance.now();
        const fourFingers = analyzeFourFingers(lm);

        // Động tác A: Đang MỞ ➔ NẮM 4 ngón lại: Card lật 180° từ Trái sang Phải (Mặt Trước -> Mặt Sau)
        if (fourFingers.isCurled) {
          if (lastFingerPose === 'EXTENDED' && (now - lastPoseFlipTime > POSE_COOLDOWN_MS)) {
            consecutivePoseFrames++;
            if (consecutivePoseFrames >= 3) {
              cardFlipped = true;
              targetRotationY = Math.PI; // Target state-driven 180° (xoay thuận chiều sang phải)
              lastPoseFlipTime = now;
              lastFingerPose = 'CURLED';
              consecutivePoseFrames = 0;
              btnFlipCard.textContent = '🔄 Mặt Sau';
            }
          } else {
            lastFingerPose = 'CURLED';
          }
        }
        // Động tác B: Đang NẮM ➔ MỞ 4 ngón ra: Card lật 180° từ Phải sang Trái (Mặt Sau -> Mặt Trước)
        else if (fourFingers.isExtended) {
          if (lastFingerPose === 'CURLED' && (now - lastPoseFlipTime > POSE_COOLDOWN_MS)) {
            consecutivePoseFrames++;
            if (consecutivePoseFrames >= 3) {
              cardFlipped = false;
              targetRotationY = 0; // Target state-driven 0° (xoay ngược chiều về trái)
              lastPoseFlipTime = now;
              lastFingerPose = 'EXTENDED';
              consecutivePoseFrames = 0;
              btnFlipCard.textContent = '🔄 Mặt Trước';
            }
          } else {
            lastFingerPose = 'EXTENDED';
          }
        }

        // 5. CỬ CHỈ PINCH DỰ PHÒNG (Kẹp ngón trỏ & cái)
        const isPinchCandidate = (pinchDist < PINCH_ON_DIST);
        if (isPinchCandidate) {
          pinchConsecutiveFrames++;
          if (pinchConsecutiveFrames >= 3 && (now - lastFlipTime > FLIP_COOLDOWN_MS)) {
            targetRotationY += Math.PI;
            cardFlipped = !cardFlipped;
            lastFlipTime = now;
            btnFlipCard.textContent = cardFlipped ? '🔄 Mặt Sau' : '🔄 Mặt Trước';
          }
        } else if (pinchDist > PINCH_OFF_DIST) {
          pinchConsecutiveFrames = 0;
        }

        // Compute palm normal/tilt from wrist 0 to middle mcp 9 & index 5
        const roll = (lm[17].y - lm[5].y) * 2.0;
        const pitch = (lm[9].z - lm[0].z) * 1.8;

        if (fourFingers.isCurled) {
          // --- GESTURE: NẮM 4 NGÓN (FIST / GRIP) ---
          currentGesture = 'FIST_FLIP';
          txtGestureIcon.textContent = '✊';
          txtGestureTitle.textContent = 'Nắm 4 Ngón: Lật Trái ➔ Phải';
          txtGestureDesc.textContent = cardFlipped ? 'Đã lật sang Mặt Sau | Mở 4 ngón để lật ngược lại' : 'Đã lật sang Mặt Trước | Mở 4 ngón để lật ngược lại';
          txtCardState.textContent = 'NẮM 4 NGÓN';
          txtCardState.style.color = '#f43f5e';

          targetPos.set(handX, handY, 0.05);
          targetScale = dynamicCardScale * 0.95;
          targetRotationX = pitch * 0.5;
          targetRotationZ = -roll * 0.5;

        } else if (isOpenPalm) {
          // --- GESTURE: XÒE LÒNG BÀN TAY (OPEN PALM ANCHOR & ZOOM) ---
          currentGesture = 'PALM';
          txtGestureIcon.textContent = '🖐️';
          txtGestureTitle.textContent = 'Xòe Lòng Bàn Tay: Thẻ Nổi 3D';
          txtGestureDesc.textContent = 'Đưa tay lại gần/xa để thu phóng (Zoom: ' + Math.min(150, Math.round(dynamicCardScale * 100)) + '%) | Nắm 4 ngón để lật thẻ';
          txtCardState.textContent = 'THU PHÓNG TAY';
          txtCardState.style.color = '#10b981';

          targetPos.set(handX, handY + 0.14, 0.1);
          targetScale = Math.min(1.50, dynamicCardScale * 1.05);
          targetRotationX = pitch;
          targetRotationZ = -roll;

        } else {
          // Neutral hand position
          currentGesture = 'HOVER';
          txtGestureIcon.textContent = '👋';
          txtGestureTitle.textContent = 'Bàn Tay Tương Tác';
          txtGestureDesc.textContent = 'Nắm/Mở 4 ngón để lật thẻ Trái ⇄ Phải | Tiến/Lùi để thu phóng 70%-150%';
          txtCardState.textContent = 'SẴN SÀNG';
          txtCardState.style.color = '#38bdf8';

          targetPos.set(handX, handY, 0);
          targetScale = dynamicCardScale;
          targetRotationX = 0;
          targetRotationZ = 0;
        }

      } else {
        // No hand visible -> idle float
        currentGesture = 'NONE';
        txtGestureIcon.textContent = '✋';
        txtGestureTitle.textContent = 'Chờ Đưa Bàn Tay Vào...';
        txtGestureDesc.textContent = 'Đưa bàn tay vào trước camera để AI kích hoạt tương tác';
        txtCardState.textContent = 'CHỜ BÀN TAY';
        txtCardState.style.color = '#94a3b8';

        // Gentle idle floating animation
        const time = performance.now() * 0.0015;
        targetPos.set(0, Math.sin(time) * 0.04, 0);
        targetRotationX = Math.sin(time * 0.8) * 0.06;
        targetRotationZ = Math.cos(time * 0.7) * 0.04;
        targetScale = 1.0;
      }
    }

    // -------------------------------------------------------------
    // DRAW SKELETON WIREFRAME ON 2D CANVAS
    // -------------------------------------------------------------
    const CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4], // Thumb
      [0,5],[5,6],[6,7],[7,8], // Index
      [5,9],[9,10],[10,11],[11,12], // Middle
      [9,13],[13,14],[14,15],[15,16], // Ring
      [13,17],[17,18],[18,19],[19,20], // Pinky
      [0,17] // Palm base
    ];

    function drawHandSkeleton(lm, ctx, w, h) {
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.8)';
      ctx.lineWidth = 3;

      CONNECTIONS.forEach(([i, j]) => {
        ctx.beginPath();
        ctx.moveTo(lm[i].x * w, lm[i].y * h);
        ctx.lineTo(lm[j].x * w, lm[j].y * h);
        ctx.stroke();
      });

      // Joint points
      lm.forEach((pt, idx) => {
        ctx.beginPath();
        ctx.arc(pt.x * w, pt.y * h, idx === 4 || idx === 8 ? 6 : 4, 0, Math.PI * 2);
        ctx.fillStyle = (idx === 4 || idx === 8) ? '#f43f5e' : '#38bdf8';
        ctx.fill();
      });
    }

    // -------------------------------------------------------------
    // ANIMATION & INTERPOLATION LOOP
    // -------------------------------------------------------------
    function animate() {
      requestAnimationFrame(animate);

      // Smooth exponential dampening (Frame-rate independent: tau = 0.12s)
      const nowMs = performance.now();
      const dt = Math.min(0.05, (nowMs - lastFrameTime) * 0.001);
      lastFrameTime = nowMs;
      const smoothFactor = 1 - Math.exp(-dt / 0.12);

      cardGroup.position.lerp(targetPos, smoothFactor);
      cardGroup.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), smoothFactor);
      
      // Tốc độ xoay lật êm ái chống giật (flipRotationSpeed = 1 - Math.exp(-dt / 0.18))
      const flipSmoothFactor = 1 - Math.exp(-dt / 0.18);
      cardGroup.rotation.x += (targetRotationX - cardGroup.rotation.x) * smoothFactor;
      cardGroup.rotation.y += (targetRotationY - cardGroup.rotation.y) * flipSmoothFactor;
      cardGroup.rotation.z += (targetRotationZ - cardGroup.rotation.z) * smoothFactor;

      renderer.render(scene, camera);

      // FPS Counter
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        txtFps.textContent = frameCount;
        frameCount = 0;
        lastFpsTime = now;
      }
    }

    // -------------------------------------------------------------
    // MEDIAPIPE INITIALIZATION
    // -------------------------------------------------------------
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults(onResults);

    let currentFacingMode = 'environment'; // 'user' (front) | 'environment' (back)
    let cameraFeed = null;

    function initCamera(facing) {
      if (cameraFeed) {
        try { cameraFeed.stop(); } catch(e){}
      }

      currentFacingMode = facing;
      const isFront = (currentFacingMode === 'user');
      
      // Mirror video only on front camera
      videoElement.style.transform = isFront ? 'scaleX(-1)' : 'none';
      skeletonCanvas.style.transform = isFront ? 'scaleX(-1)' : 'none';

      cameraFeed = new Camera(videoElement, {
        onFrame: async () => {
          lastInferenceStart = performance.now();
          await hands.send({ image: videoElement });
        },
        facingMode: { ideal: currentFacingMode },
        width: 1280,
        height: 720
      });

      return cameraFeed.start();
    }

    let isSimulating = false;

    function startSimulationMode(reason) {
      isSimulating = true;
      console.log('Starting Interactive Simulation Mode:', reason);
      loadingOverlay.style.opacity = '0';
      setTimeout(() => loadingOverlay.style.display = 'none', 400);

      // Start Three.js animation loop
      animate();

      txtGestureTitle.textContent = 'Chế Độ Thử Nghiệm Chuột / Cảm Ứng';
      txtGestureDesc.textContent = 'Rê chuột = Bàn tay di chuyển | Nhấn giữ chuột = Kẹp ngón tay (Pinch) | Thả chuột = Xòe bàn tay';
      txtCardState.textContent = 'MÔ PHỎNG TAY';
      txtCardState.style.color = '#38bdf8';

      let isMouseDown = false;

      function simulateHand(clientX, clientY, isPinch) {
        const normX = clientX / window.innerWidth;
        const normY = clientY / window.innerHeight;

        // Generate synthetic 21 landmarks
        const mockLm = [];
        for (let i = 0; i <= 20; i++) mockLm.push({ x: normX, y: normY, z: 0 });

        mockLm[0] = { x: normX, y: Math.min(1, normY + 0.2), z: 0 };
        mockLm[9] = { x: normX, y: normY, z: -0.05 };

        if (isPinch) {
          // Pinch
          mockLm[4] = { x: normX - 0.01, y: normY, z: 0 };
          mockLm[8] = { x: normX + 0.01, y: normY, z: 0 };
          mockLm[12] = { x: normX, y: normY - 0.1, z: 0 };
        } else {
          // Open Palm
          mockLm[4] = { x: normX - 0.1, y: normY - 0.05, z: 0 };
          mockLm[8] = { x: normX - 0.04, y: normY - 0.18, z: 0 };
          mockLm[6] = { x: normX - 0.04, y: normY - 0.1, z: 0 };
          mockLm[12] = { x: normX, y: normY - 0.2, z: 0 };
          mockLm[10] = { x: normX, y: normY - 0.12, z: 0 };
          mockLm[16] = { x: normX + 0.04, y: normY - 0.17, z: 0 };
          mockLm[14] = { x: normX + 0.04, y: normY - 0.09, z: 0 };
          mockLm[20] = { x: normX + 0.08, y: normY - 0.13, z: 0 };
          mockLm[18] = { x: normX + 0.08, y: normY - 0.07, z: 0 };
        }

        onResults({ multiHandLandmarks: [mockLm] });
      }

      window.addEventListener('mousemove', (e) => {
        simulateHand(e.clientX, e.clientY, isMouseDown);
      });

      window.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        simulateHand(e.clientX, e.clientY, true);
      });

      window.addEventListener('mouseup', (e) => {
        isMouseDown = false;
        simulateHand(e.clientX, e.clientY, false);
      });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          simulateHand(e.touches[0].clientX, e.touches[0].clientY, isMouseDown);
        }
      });
      window.addEventListener('touchstart', (e) => {
        isMouseDown = true;
        if (e.touches.length > 0) simulateHand(e.touches[0].clientX, e.touches[0].clientY, true);
      });
      window.addEventListener('touchend', () => {
        isMouseDown = false;
      });

      // Initial hand position
      simulateHand(window.innerWidth / 2, window.innerHeight / 2, false);
    }

    initCamera(currentFacingMode).then(() => {
      console.log('Camera started successfully with facingMode:', currentFacingMode);
      loadingOverlay.style.opacity = '0';
      setTimeout(() => loadingOverlay.style.display = 'none', 400);
      animate();
    }).catch(err => {
      console.warn('Camera not available, falling back to Simulation Mode:', err);
      startSimulationMode(err.message);
    });

    const btnSwitchCam = document.getElementById('btnSwitchCam');
    if (btnSwitchCam) {
      btnSwitchCam.onclick = () => {
        const nextFacing = currentFacingMode === 'user' ? 'environment' : 'user';
        btnSwitchCam.textContent = nextFacing === 'user' ? '📷 Cam: Trước' : '📷 Cam: Sau';
        initCamera(nextFacing).catch(e => {
          console.warn('Switch camera error:', e);
        });
      };
    }

    // -------------------------------------------------------------
    // CONTROLS & EVENTS
    // -------------------------------------------------------------
    btnToggleMesh.onclick = () => {
      showSkeleton = !showSkeleton;
      btnToggleMesh.textContent = `🦴 Khớp Xương: ${showSkeleton ? 'BẬT' : 'TẮT'}`;
      btnToggleMesh.classList.toggle('active', showSkeleton);
    };

    btnFlipCard.onclick = () => {
      cardFlipped = !cardFlipped;
      targetRotationY = cardFlipped ? Math.PI : 0;
      btnFlipCard.textContent = cardFlipped ? '🔄 Mặt Sau' : '🔄 Mặt Trước';
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
