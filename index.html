<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>inid.me — Smart AR Business Card</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📇</text></svg>">
  <script type="module" src="assets/vendor/model-viewer.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-front: linear-gradient(145deg, #131b2e, #090d16);
      --card-back: linear-gradient(145deg, #0f172a, #020617);
      --border: rgba(255, 255, 255, 0.12);
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .top-nav {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .logo-brand {
      display: flex;
      align-items: center;
      text-decoration: none;
    }
    .logo-brand img {
      height: 38px;
    }
    .top-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-edit {
      background: #131b2e;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.15s;
    }
    .btn-edit:hover { background: #1e293b; }
    .lang-select {
      background: #131b2e;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      outline: none;
    }

    /* 3D Flip Card Container */
    .card-perspective {
      perspective: 1200px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 24px;
    }
    .card-perspective.horizontal {
      max-width: 460px;
    }
    .card-3d {
      width: 100%;
      min-height: 480px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .card-perspective.horizontal .card-3d {
      min-height: 310px;
    }
    .card-3d.flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 22px;
      padding: 26px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--border);
      box-shadow: 0 20px 45px -15px rgba(0,0,0,0.7);
      user-select: none;
    }
    .card-front {
      background: var(--card-front);
    }
    .card-back {
      background: var(--card-back);
      transform: rotateY(180deg);
      text-align: center;
    }

    /* Front Elements */
    .front-top {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .avatar-img {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary);
      background: #1e293b;
      flex-shrink: 0;
    }
    .card-perspective.horizontal .avatar-img {
      width: 64px;
      height: 64px;
    }
    .person-info h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.25;
    }
    .person-info p {
      font-size: 0.85rem;
      color: var(--primary);
      margin-top: 3px;
    }
    .front-contacts {
      margin: 18px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text);
      text-decoration: none;
      padding: 9px 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.05);
      transition: background 0.15s;
    }
    .contact-item:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--primary);
    }
    .front-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .social-icons-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .soc-pill {
      height: 32px;
      padding: 0 10px;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 500;
      transition: background 0.15s;
    }
    .soc-pill:hover {
      background: var(--primary);
      color: #090d16;
    }
    .flip-hint {
      font-size: 0.72rem;
      color: var(--muted);
      opacity: 0.85;
    }

    /* Back Elements */
    .back-content {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .company-logo {
      max-width: 84px;
      max-height: 84px;
      object-fit: contain;
      border-radius: 12px;
    }
    .company-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
    }
    .company-slogan {
      font-size: 0.84rem;
      color: var(--primary);
      font-style: italic;
    }
    .company-address {
      font-size: 0.8rem;
      color: var(--muted);
      max-width: 290px;
      line-height: 1.4;
    }

    /* Action Buttons */
    .actions-bar {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-perspective.horizontal + .actions-bar {
      max-width: 460px;
    }
    .btn-main {
      width: 100%;
      background: var(--primary);
      color: #090d16;
      border: none;
      padding: 13px 20px;
      font-size: 0.92rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-main:active { transform: scale(0.98); }
    .btn-main:hover { background: #7dd3fc; }
    .btn-outline {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 600;
    }
    .btn-outline:hover {
      background: rgba(255,255,255,0.1);
    }

    model-viewer {
      display: none;
      width: 100%;
      height: 300px;
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="#" class="logo-brand">
      <img src="assets/logo-concept-1.svg" alt="inid.me">
    </a>
    <div class="top-controls">
      <select id="langSelect" class="lang-select"></select>
      <a href="edit/" class="btn-edit" id="btnEditCard">✏️ Studio</a>
    </div>
  </nav>

  <!-- Interactive 3D Flip Card -->
  <div class="card-perspective" id="cardContainer">
    <div class="card-3d" id="card3d" title="Chạm để lật thẻ">
      <!-- FRONT SIDE -->
      <div class="card-face card-front">
        <div class="front-top">
          <img id="viewAvatar" class="avatar-img" src="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23131b2e%22 stroke=%22%2338bdf8%22 stroke-width=%223%22/><text x=%2250%22 y=%2258%22 font-size=%2232%22 text-anchor=%22middle%22 fill=%22%2338bdf8%22>ID</text></svg>" alt="Avatar">
          <div class="person-info">
            <h2 id="viewFn">Phan Mạnh Khang</h2>
            <p id="viewTitle">Kỹ Thuật Viên Trưởng</p>
            <p id="viewOrg" style="font-size:0.78rem; color:var(--muted)">Minh Tam Prolab</p>
          </div>
        </div>

        <div class="front-contacts">
          <a id="viewTelLink" href="tel:+84901112233" class="contact-item">
            <span>📞</span> <span id="viewTel">+84 90 111 2233</span>
          </a>
          <a id="viewEmailLink" href="mailto:khang@minhtamprolab.com.vn" class="contact-item">
            <span>✉️</span> <span id="viewEmail">khang@minhtamprolab.com.vn</span>
          </a>
          <a id="viewUrlLink" href="https://minhtamprolab.com.vn" target="_blank" class="contact-item">
            <span>🌐</span> <span id="viewUrl">minhtamprolab.com.vn</span>
          </a>
        </div>

        <div class="front-bottom">
          <div class="social-icons-wrap" id="socialBox"></div>
          <span class="flip-hint" id="txtFlipHint">Chạm để lật 🔄</span>
        </div>
      </div>

      <!-- BACK SIDE -->
      <div class="card-face card-back">
        <div class="back-content">
          <img id="viewLogo" class="company-logo" src="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%23131b2e%22 stroke=%22%2338bdf8%22 stroke-width=%222%22/><text x=%2250%22 y=%2260%22 font-size=%2232%22 text-anchor=%22middle%22 font-weight=%22bold%22 fill=%22%2338bdf8%22>MT</text></svg>" alt="Logo">
          <h3 class="company-name" id="viewBackOrg">Minh Tam Prolab</h3>
          <p class="company-slogan" id="viewSlogan">Professional Digital Laboratory</p>
          <p class="company-address" id="viewAdr">40A-40B Lý Tự Trọng, Phường Sài Gòn, TPHCM</p>
        </div>
        <div class="front-bottom" style="justify-content: center;">
          <span class="flip-hint" id="txtFlipHintBack">Chạm để lật 🔄</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions-bar">
    <button class="btn-main" id="btnSaveVcf">
      <span>💾</span> <span id="txtSaveVcf">Lưu Danh Bạ (.vcf)</span>
    </button>
    <button class="btn-main btn-outline" id="btnLaunchAr">
      <span>🕶️</span> <span id="txtViewAr">Xem Thẻ 3D Trong Không Gian AR</span>
    </button>
    <button class="btn-main btn-outline" id="btnToggleOrient" style="font-size:0.85rem;">
      <span>📐</span> <span id="txtToggleOrient">Đổi Bố Cục Thẻ (Dọc / Ngang)</span>
    </button>
  </div>

  <!-- Native AR Model Viewer Engine -->
  <model-viewer id="arViewer"
    src="assets/3d/card.glb"
    ios-src="assets/3d/card.usdz"
    alt="3D Smart Business Card"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate>
  </model-viewer>

<script type="module">
  import { I18N, getTranslation } from './assets/i18n.js';

  let currentLang = 'vi';
  let profile = {
    fn: "Phan Mạnh Khang",
    org: "Minh Tam Prolab",
    title: "Kỹ Thuật Viên Trưởng",
    tel: "+84901112233",
    email: "khang@minhtamprolab.com.vn",
    url: "https://minhtamprolab.com.vn",
    adr: "40A-40B Lý Tự Trọng, Phường Sài Gòn, TPHCM",
    slogan: "Professional Digital Laboratory",
    orientation: "vertical",
    socials: [
      { type: "fb", name: "Facebook", handle: "phanmanhkhang", url: "https://facebook.com/phanmanhkhang" },
      { type: "zalo", name: "Zalo", handle: "0901112233", url: "https://zalo.me/0901112233" }
    ],
    avatar: "",
    logo: ""
  };

  // Decode profile from URL hash if present
  if (window.location.hash.startsWith('#data=')) {
    try {
      const b64 = window.location.hash.slice(6);
      const jsonStr = decodeURIComponent(atob(b64));
      profile = Object.assign(profile, JSON.parse(jsonStr));
    } catch(e) {
      console.warn('Could not parse profile from URL hash:', e);
    }
  }

  // Populate Languages
  const langSelect = document.getElementById('langSelect');
  Object.keys(I18N).forEach(code => {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = I18N[code].name;
    if (code === (profile.lang || 'vi')) opt.selected = true;
    langSelect.appendChild(opt);
  });

  currentLang = langSelect.value;
  langSelect.addEventListener('change', (e) => {
    currentLang = e.target.value;
    updateI18n();
  });

  function updateI18n() {
    document.getElementById('txtSaveVcf').textContent = getTranslation(currentLang, 'saveVcf');
    document.getElementById('txtViewAr').textContent = getTranslation(currentLang, 'viewAr');
    document.getElementById('txtFlipHint').textContent = getTranslation(currentLang, 'flipCard') + ' 🔄';
    document.getElementById('txtFlipHintBack').textContent = getTranslation(currentLang, 'flipCard') + ' 🔄';
  }

  // Bind Data to UI
  function renderProfile() {
    document.getElementById('viewFn').textContent = profile.fn || 'Chưa đặt tên';
    document.getElementById('viewTitle').textContent = profile.title || '';
    document.getElementById('viewOrg').textContent = profile.org || '';
    document.getElementById('viewBackOrg').textContent = profile.org || '';
    document.getElementById('viewTel').textContent = profile.tel || '';
    document.getElementById('viewTelLink').href = `tel:${profile.tel || ''}`;
    document.getElementById('viewEmail').textContent = profile.email || '';
    document.getElementById('viewEmailLink').href = `mailto:${profile.email || ''}`;
    
    const displayUrl = (profile.url || 'inid.me').replace(/^https?:\/\//i, '');
    document.getElementById('viewUrl').textContent = displayUrl;
    document.getElementById('viewUrlLink').href = profile.url ? (profile.url.startsWith('http') ? profile.url : `https://${profile.url}`) : 'https://inid.me';
    
    document.getElementById('viewSlogan').textContent = profile.slogan || '';
    document.getElementById('viewAdr').textContent = profile.adr || '';

    if (profile.avatar) document.getElementById('viewAvatar').src = profile.avatar;
    if (profile.logo) document.getElementById('viewLogo').src = profile.logo;

    // Render Dynamic Socials
    const socBox = document.getElementById('socialBox');
    socBox.innerHTML = '';
    if (Array.isArray(profile.socials)) {
      profile.socials.forEach(s => {
        const a = document.createElement('a');
        a.className = 'soc-pill';
        a.href = s.url;
        a.target = '_blank';
        a.innerHTML = `<span>🔗</span> <span>${s.name}: ${s.handle}</span>`;
        socBox.appendChild(a);
      });
    }

    // Orientation
    applyOrientation(profile.orientation || 'vertical');
  }

  function applyOrientation(orient) {
    const c = document.getElementById('cardContainer');
    if (orient === 'horizontal') c.classList.add('horizontal');
    else c.classList.remove('horizontal');
  }

  // 3D Flip Card interaction
  const card3d = document.getElementById('card3d');
  card3d.addEventListener('click', () => {
    card3d.classList.toggle('flipped');
  });

  // Toggle Orientation Button
  document.getElementById('btnToggleOrient').addEventListener('click', () => {
    profile.orientation = profile.orientation === 'horizontal' ? 'vertical' : 'horizontal';
    applyOrientation(profile.orientation);
  });

  // Download clean vcf (<480B)
  document.getElementById('btnSaveVcf').addEventListener('click', () => {
    const lines = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      `FN;CHARSET=UTF-8:${profile.fn || 'Contact'}`,
      `N;CHARSET=UTF-8:;;;;`
    ];
    if (profile.org) lines.push(`ORG;CHARSET=UTF-8:${profile.org}`);
    if (profile.title) lines.push(`TITLE;CHARSET=UTF-8:${profile.title}`);
    if (profile.tel) lines.push(`TEL;TYPE=CELL:${profile.tel}`);
    if (profile.email) lines.push(`EMAIL;TYPE=INTERNET:${profile.email}`);
    if (profile.adr) lines.push(`ADR;TYPE=WORK;CHARSET=UTF-8:;;${profile.adr};;;;`);
    lines.push(`URL:${profile.url || 'https://inid.me'}`);
    lines.push('END:VCARD\r\n');

    const vcfText = lines.join('\r\n');
    const blob = new Blob([vcfText], { type: 'text/vcard;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${profile.fn || 'contact'}.vcf`;
    a.click();
  });

  // Launch AR Native Viewer
  document.getElementById('btnLaunchAr').addEventListener('click', () => {
    const viewer = document.getElementById('arViewer');
    if (viewer.canActivateAR) {
      viewer.activateAR();
    } else {
      const usdzUrl = 'assets/3d/card.usdz';
      const a = document.createElement('a');
      a.setAttribute('rel', 'ar');
      a.appendChild(document.createElement('img'));
      a.setAttribute('href', usdzUrl);
      a.click();
    }
  });

  renderProfile();
  updateI18n();
</script>

</body>
</html>
